<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawLine 8s linear infinite;
      }
      .pulse-pill {
        animation: pulsePill 3s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="glow-orb-1" style="transform-origin: 200px 150px;">
    <circle cx="200" cy="150" r="180" fill="url(#glowGrad1)"/>
  </g>
  <g class="glow-orb-2" style="transform-origin: 1000px 250px;">
    <circle cx="1000" cy="250" r="220" fill="url(#glowGrad2)"/>
  </g>

  <!-- Flow / Dynamic Stream Lines (Strictly in Background) -->
  <path class="wave-line" d="M -100 320 C 300 390, 700 240, 1300 340" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>
  <path class="wave-line" d="M -100 340 C 400 220, 800 370, 1300 300" fill="none" stroke="rgba(192, 132, 252, 0.22)" stroke-width="1.5"/>

  <!-- Foreground Content: Title, Badges, Tagline -->
  <g id="foreground" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    
    <!-- Top Category Pill -->
    <g transform="translate(600, 70)" text-anchor="middle">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
      <text y="5" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="2">DATA-CENTRIC AI &amp; QUALITY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Data-Centric AI
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" font-size="24" font-weight="600" fill="url(#subGrad)" letter-spacing="0.5">
      &amp; Data Quality Curation Ecosystem
    </text>

    <!-- Tagline Description -->
    <text x="600" y="240" text-anchor="middle" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Label Error Detection, Data Curation &amp; Quality Scoring
    </text>

    <!-- Interactive / Status Pills in Foreground Bottom -->
    <g transform="translate(600, 310)" text-anchor="middle" class="pulse-pill">
      <!-- Pill 1: Label Errors -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-60" cy="0" r="4" fill="#38bdf8"/>
        <text x="5" y="5" fill="#e2e8f0" font-size="13" font-weight="600">Label Errors</text>
      </g>
      <!-- Pill 2: Weak Supervision -->
      <g transform="translate(-110, 0)">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-70" cy="0" r="4" fill="#818cf8"/>
        <text x="5" y="5" fill="#e2e8f0" font-size="13" font-weight="600">Weak Supervision</text>
      </g>
      <!-- Pill 3: Data Quality Curation -->
      <g transform="translate(115, 0)">
        <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-80" cy="0" r="4" fill="#c084fc"/>
        <text x="5" y="5" fill="#e2e8f0" font-size="13" font-weight="600">Quality Scoring</text>
      </g>
      <!-- Pill 4: LLM DataOps -->
      <g transform="translate(325, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
        <circle cx="-55" cy="0" r="4" fill="#34d399"/>
        <text x="5" y="5" fill="#e2e8f0" font-size="13" font-weight="600">LLM DataOps</text>
      </g>
    </g>

    <!-- Bottom Metadata / Badge note -->
    <text x="600" y="380" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      PRODUCTION-GRADE CURATION • MULTI-MODAL DATA QUALITY • ACTIVE LEARNING
    </text>
  </g>
</svg>
